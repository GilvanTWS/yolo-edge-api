📸 O que tirar print para a evidência: Tire um print da tela do terminal mostrando a execução do comando dvc push e o retorno de sucesso indicando que os arquivos foram transferidos para o diretório de armazenamento (~/dvc-storage)
.
🚨 ALERTA DE ENTREGA 2 (15 pontos)
Objetivo: Evidência de models/yolov8n.pt.dvc commitado no repositório
.
Para salvar essa versão do ponteiro do modelo no seu histórico de código, execute estes comandos no terminal
:

# Adiciona o ponteiro dvc, a lista de ignorados atualizada e a configuração do remote
git add models/yolov8n.pt.dvc models/.gitignore .dvc/config

# Commita a alteração
git commit -m "feat: adiciona yolov8n.pt ao controle do DVC"

# Sobe as alterações para o GitHub
git push origin main

📸 O que tirar print para a evidência: Acesse o seu repositório no GitHub pelo navegador, navegue até a pasta models/ e tire um print mostrando o arquivo yolov8n.pt.dvc listado lá
. Dica: certifique-se de que o arquivo real yolov8n.pt NÃO está aparecendo lá (ele deve ser ignorado pelo Git), apenas o arquivo .dvc
.
