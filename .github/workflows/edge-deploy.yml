Parte 3: Pirâmide de Testes Automatizados para IA
Como vimos brevemente, testar sistemas de IA é diferente porque modelos de aprendizado de máquina são estatísticos e não determinísticos
. Para mitigar regressões e garantir que a aplicação não quebre em campo, implementamos uma Pirâmide de Testes dividida em camadas de validação local antes de subir o código
:

    Smoke Tests (Testes de Fumaça): Garantem que a infraestrutura básica funciona. Fazem requisições rápidas para /health e /metrics apenas para verificar se a API FastAPI responde com sucesso (HTTP 200)

.
Unit Tests (Testes Unitários): Testam funções isoladas sem envolver o modelo de IA. O foco principal é a função _decode_image, validando se ela converte uma imagem JPEG/PNG codificada em Base64 em um array multidimensional do NumPy com as dimensões corretas
.
Integration Tests (Testes de Integração): Validam o fluxo completo. Carregam o modelo real yolov8n.pt e fazem uma requisição do tipo POST para o endpoint /predict contendo uma imagem real (zidane.jpg) codificada em Base64, garantindo que o modelo detecta pelo menos um objeto e retorna o payload no formato correto

    .

Preparação do Ambiente Local de Testes no Raspberry Pi
Para rodar os testes localmente no Raspberry Pi, a API precisa ler o modelo. No entanto, o código da API aponta para o diretório absoluto /app/models (que funciona de forma nativa dentro do container Docker)
. Fora do container, precisamos replicar esse mapeamento usando um link simbólico no Linux para evitar alterações no código de produção
:

