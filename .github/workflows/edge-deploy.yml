# .github/workflows/edge-deploy.yml
# Pipeline simplificado: lint → testes → build ARM64 → quality gate → deploy
# Nota: os steps de rede (Tailscale) foram removidos; o CI baixa o modelo
# diretamente do Ultralytics em vez de depender do remote DVC local do Pi.
name: Edge AI — Build, Test e Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY:    ghcr.io
  IMAGE_NAME:  ${{ github.repository }}/yolo-api
  YOLO_MODEL_URL: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt
jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Lint e testes unitários / smoke / integration
  # Runner: ubuntu-latest (x86_64, gratuito no GitHub)
  # ─────────────────────────────────────────────────────────
  test:
    name: "Lint & Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências (CPU)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r app/requirements.txt
          pip install pytest ruff
      - name: Baixar modelo para os testes
        run: |
          mkdir -p models
          wget -q -O models/yolov8n.pt "$YOLO_MODEL_URL"
          ls -lh models/yolov8n.pt
      - name: Disponibiliza o modelo em /app/models (mesmo path usado no Docker)
        run: |
          sudo mkdir -p /app
          sudo ln -sfn "$GITHUB_WORKSPACE/models" /app/models
          ls -la /app/models
      - name: Lint (ruff)
        run: ruff check app/
      - name: Testes automatizados
        run: pytest tests/ -v --tb=short
  # ─────────────────────────────────────────────────────────
  # JOB 2: Build da imagem Docker multi-arquitetura
  # Plataforma: linux/arm64
  # ─────────────────────────────────────────────────────────
  build:
    name: "Build & Push (ARM64)"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar QEMU (emulação ARM64)
        uses: docker/setup-qemu-action@v3
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Baixar modelo para a imagem
        run: |
          mkdir -p models
          wget -q -O models/yolov8n.pt "$YOLO_MODEL_URL"
          ls -lh models/yolov8n.pt
      - name: Build e Push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
  # ─────────────────────────────────────────────────────────
  # JOB 3: Quality gate do modelo
  # Valida mAP@0.5 antes de autorizar o deploy
  # ─────────────────────────────────────────────────────────
  model-gate:
    name: "Model Quality Gate"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics
      - name: Baixar modelo para validação
        run: |
          mkdir -p models
          wget -q -O models/yolov8n.pt "$YOLO_MODEL_URL"
          ls -lh models/yolov8n.pt
      - name: Executar quality gate (mAP@0.5 >= 0.50)
        run: python scripts/validate_model.py --threshold 0.50
  # ─────────────────────────────────────────────────────────
  # JOB 4: Deploy no Raspberry Pi 5 via SSH (opcional)
  # Executa apenas em push para main.
  # Como o runner rode na nuvem, o deploy só acontece se o secret
  # RPI_SSH_KEY existir e RPI_HOST for alcançável (ex.: via Tailscale).
  # Caso contrário, os steps de SSH são pulados e o job passa sem erro.
  # ─────────────────────────────────────────────────────────
  deploy:
    name: "Deploy → Raspberry Pi 5"
    needs: model-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RPI_HOST_: ${{ secrets.RPI_HOST }}
      RPI_USER_: ${{ secrets.RPI_USER }}
      RPI_SSH_KEY_: ${{ secrets.RPI_SSH_KEY }}
      RPI_DEPLOY_PATH_: ${{ secrets.RPI_DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verifica secrets SSH
        id: checkssh
        run: |
          if [ -n "$RPI_SSH_KEY_" ] && [ -n "$RPI_HOST_" ]; then
            echo "SSH secrets presentes — deploy será executado."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "SSH secrets ausentes — deploy não executado (skip)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy via SSH com rollback automático
        if: steps.checkssh.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ env.RPI_HOST_ }}
          username: ${{ env.RPI_USER_ }}
          key:      ${{ env.RPI_SSH_KEY_ }}
          command_timeout: 30m
          script: |
            export DEPLOY_PATH=$RPI_DEPLOY_PATH_
            cd "$DEPLOY_PATH"
            git pull origin main
            bash scripts/deploy.sh
      - name: Notificar resultado
        if: always()
        run: |
          echo "Deploy status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
