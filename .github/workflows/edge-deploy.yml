Passo 1: Criar o Portão de Qualidade do Modelo (validate_model.py)
Esse script garante que nenhum modelo "cego" (com baixa precisão) vá para os dispositivos em campo. Ele roda uma validação rápida do YOLO e, se a métrica estatística mAP@0.5 for menor que 0.50, ele aborta o pipeline impedindo o deploy.
Rode o comando no seu terminal:

nano scripts/validate_model.py

Cole o código abaixo dentro do arquivo:

"""
scripts/validate_model.py
Portão de Qualidade do Modelo (Model Quality Gate).
Verifica se a precisão do YOLOv8 atende ao limite mínimo antes do deploy.
"""
import sys
from pathlib import Path
from ultralytics import YOLO

def validate():
    print("Iniciando validação de qualidade estatística do modelo...")
    model_path = Path("models/yolov8n.pt")
    
    if not model_path.exists():
        print(f"Erro: Modelo não encontrado em {model_path}")
        sys.exit(1)
        
    try:
        # Carrega o modelo de forma local
        model = YOLO(model_path)
        
        # Executa validação rápida usando o dataset reduzido coco8
        print("Rodando validação no dataset coco8...")
        metrics = model.val(data="coco8.yaml", imgsz=640, plots=False)
        
        # Extrai o mAP@0.5 (Mean Average Precision)
        map50 = metrics.results_dict.get("metrics/mAP50(B)", 0.0)
        print(f"Métrica mAP@0.5 obtida: {map50:.4f}")
        
        LIMIAR_MINIMO = 0.50
        if map50 < LIMIAR_MINIMO:
            print(f"❌ REPROVADO: Precisão ({map50:.4f}) abaixo do limiar mínimo de {LIMIAR_MINIMO}!")
            sys.exit(1)
            
        print("✅ APROVADO: O modelo passou com sucesso pelo Portão de Qualidade!")
        sys.exit(0)
        
    except Exception as e:
        print(f"Erro crítico durante o portão de qualidade: {e}")
        sys.exit(1)

if __name__ == "__main__":
    validate()

Salve e feche o arquivo (Ctrl+O, Enter, Ctrl+X).
Passo 2: Criar o Script de Deploy com Watchdog (deploy.sh)
Esse script roda dentro da Raspberry Pi. Ele atualiza o código, puxa o modelo novo do DVC, inicia o container e ativa um Watchdog (cão de guarda) de saúde por 60 segundos. Se o container falhar e não responder ao endpoint /health, o script desfaz o deploy (Rollback) restaurando a versão estável anterior.
Rode o comando no seu terminal:

nano scripts/deploy.sh

Cole o script abaixo dentro dele:

#!/bin/bash
# scripts/deploy.sh
# Script de deploy contínuo in-place com monitoramento de saúde e rollback.
set -e

APP_DIR="/home/gilvantws/yolo-edge-api"
cd "$APP_DIR"

echo "=== INICIANDO IMPLANTAÇÃO NO EDGE ==="

# 1. Armazena o estado atual do commit Git para rollback em caso de falha de saúde
PREVIOUS_COMMIT=$(git rev-parse HEAD)
echo "Versão atual de segurança (Rollback Point): $PREVIOUS_COMMIT"

# 2. Puxa as novas atualizações de código e ponteiros do DVC
echo "Sincronizando repositório com o GitHub..."
git pull origin main

# 3. Puxa o modelo real correspondente do DVC storage
echo "Puxando modelo do DVC..."
dvc pull

# 4. Reconstrói e sobe os containers atualizados
echo "Subindo os containers Docker..."
docker compose up -d --build api

# 5. Cão de Guarda (Watchdog) de Saúde por 60 segundos (12 tentativas a cada 5 segundos)
echo "Iniciando Watchdog de Saúde..."
HEALTH_URL="http://localhost:8000/health"
DEPLOY_SUCCESS=false

for i in {1..12}; do
    echo "Tentativa $i/12 de checar saúde da API..."
    if curl -s -f "$HEALTH_URL" > /dev/null; then
        echo "✅ Sucesso! O novo container respondeu perfeitamente ao Health Check."
        DEPLOY_SUCCESS=true
        break
    fi
    echo "Serviço indisponível. Aguardando 5 segundos..."
    sleep 5
done

# 6. Se o teste de saúde falhar, faz o rollback automático para o commit anterior estável
if [ "$DEPLOY_SUCCESS" = false ]; then
    echo "❌ CRÍTICO: O novo container falhou no teste de saúde! Iniciando rollback automático..."
    
    # Reverte o Git para o commit anterior
    git checkout "$PREVIOUS_COMMIT"
    
    # Restaura o modelo do DVC para o correspondente daquele commit anterior
    dvc checkout
    
    # Sobe o container novamente com a versão restaurada estável
    docker compose up -d --build api
    
    echo "🔄 Rollback executado com sucesso! Sistema restaurado para a versão anterior estável."
    exit 1
fi

echo "=== DEPLOY CONCLUÍDO COM SUCESSO ABSOLUTO! 🚀 ==="

Salve e feche o arquivo (Ctrl+O, Enter, Ctrl+X).
Temos que dar permissão de execução a esse script para que o Linux consiga rodá-lo:

chmod +x scripts/deploy.sh

Passo 3: Criar o Workflow do GitHub Actions
Agora só precisamos criar o arquivo do pipeline para orquestrar tudo no GitHub.
Execute no terminal:

nano .github/workflows/edge-deploy.yml

E cole a configuração completa do workflow abaixo:

name: Edge AI CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências de Validação
        run: |
          pip install ultralytics

      - name: Executar Portão de Qualidade do Modelo
        run: |
          python scripts/validate_model.py

      - name: Conectar via SSH e Disparar Deploy no Edge
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets::RPI_HOST }}
          username: ${{ secrets::RPI_USER }}
          key: ${{ secrets::RPI_SSH_KEY }}
          script: |
            export PATH=$PATH:~/.local/bin
            bash ${{ secrets::RPI_DEPLOY_PATH }}/scripts/deploy.sh
