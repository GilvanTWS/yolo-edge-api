Objetivo: Captura do dvc push bem-sucedido.
Agora, envie o arquivo de pesos real (yolov8n.pt) para o armazenamento que você configurou. Execute no seu terminal:

dvc push

📸 O que você deve tirar print: Tire uma captura de tela (print) do seu terminal mostrando o comando dvc push rodando e a mensagem de sucesso indicando que o arquivo foi enviado/copiado para o storage.
🚨 ALERTA DE ENTREGA 2 (15 pontos)
Objetivo: Evidência de models/yolov8n.pt.dvc commitado no repositório.
Agora precisamos enviar o arquivo de ponteiro (.dvc) para o seu GitHub, para que ele saiba qual versão do modelo corresponde a este commit. Execute no terminal:

# 1. Adiciona o arquivo .dvc e as atualizações do .gitignore ao Git
git add models/yolov8n.pt.dvc models/.gitignore

# 2. Registra o commit
git commit -m "feat: adiciona modelo yolov8n.pt rastreado via DVC"

# 3. Envia para o seu repositório do GitHub
git push origin main

