.
Parte 4: Anatomia do Pipeline de CI/CD (GitHub Actions)
Com a certeza de que a aplicação passa nos testes locais, podemos falar sobre a automação contínua. Um pipeline de CI/CD para Edge AI roda de forma sequencial no GitHub Actions toda vez que você realiza um git push para a branch main
. Ele é composto por 4 Jobs integrados
:
Job 1: Lint & Tests
Roda em um ambiente x86_64 padrão e gratuito fornecido pelo GitHub (ubuntu-latest)
. Ele executa o linter ruff para verificar o padrão de escrita do código e o pytest para rodar os 14 testes automatizados. Como o runner do GitHub precisa do modelo para os testes de integração, ele conecta temporariamente à VPN privada via Tailscale, monta uma chave SSH temporária e puxa o modelo binário diretamente da Raspberry Pi usando dvc pull antes de executar o Pytest
.
Job 2: Build & Push (ARM64)
Este job compila e empacota a API em uma imagem Docker
. Como os runners do GitHub rodam em processadores Intel (x86_64) e o Raspberry Pi roda sob processadores ARM64, utilizamos duas ferramentas
:

    QEMU: Emulador que permite ao processador x86_64 interpretar e gerar instruções binárias ARM64

.
Docker Buildx: Ferramenta que gerencia o build multi-arquitetura e gera manifests que apontam de forma transparente para a imagem correta dependendo do hardware que faz o docker pull

    .

Ao finalizar, a imagem Docker com tag baseada no hash do commit (yolo-api:sha-<commit_hash>) é enviada para o GitHub Container Registry (GHCR)
.
Job 3: Model Quality Gate
O Model Quality Gate impede que modelos sem a precisão estatística exigida sigam para deploy
. O runner do GitHub faz o dvc pull dos pesos do YOLO e roda um script Python (scripts/validate_model.py). O script roda uma validação do modelo usando o dataset COCO128 e extrai a métrica mAP@0.5 (Mean Average Precision). Se a precisão for inferior ao limiar mínimo definido (ex: 0.50), o script sai com erro (sys.exit(1)) e bloqueia o deploy imediatamente para proteger as operações de campo de uma IA "cega"
.
Job 4: Deploy (via SSH e Tailscale)
Se todas as etapas passarem, o GitHub se conecta de forma segura ao IP do Raspberry Pi gerado na VPN do Tailscale
. O GitHub executa via SSH remoto o script de deploy (scripts/deploy.sh), atualiza o repositório com git pull, realiza o docker compose pull para baixar a imagem nova compilada em ARM64 e sobe o container
.
Parte 5: Estratégias de Implantação e Rollback no Edge
No ecossistema de dispositivos físicos de borda, a escolha da estratégia de deploy define a segurança da sua operação
:

    Rolling Update: Atualiza um container por vez em ambientes com múltiplas réplicas, minimizando interrupções

.
Blue-Green Deploy: Mantém dois stacks de infraestrutura completos e faz a transição rápida de tráfego. Garante altíssima disponibilidade, mas exige o dobro de hardware (dobra o consumo de memória RAM do Pi)
.
Canary Deploy: Libera a versão atualizada apenas em uma porcentagem do parque de dispositivos (ex: 1 de 10) e avalia o comportamento antes de expandir
.
In-place com Watchdog (Nosso caso): Atualiza o container atual diretamente no dispositivo único
. Mas, para mitigar o risco de corrupção ou indisponibilidade, o script de deploy no Raspberry Pi (scripts/deploy.sh) atua como um Watchdog (cão de guarda) com Rollback Automático

    .

Como funciona o Watchdog de Rollback no Edge?
O script deploy.sh grava em memória qual era a imagem Docker que estava rodando antes da atualização
. Ele sobe a nova imagem e inicia um loop de monitoramento de saúde (Health Check) fazendo requisições ao endpoint /health por até 60 segundos
.

    Se o endpoint responder com sucesso, o deploy é consolidado como bem-sucedido

.
Se o health check falhar seguidamente por tempo limite, o script detecta o estado instável
, derruba o serviço problemático e roda o comando apontando novamente para a imagem anterior salva (IMAGE=$PREVIOUS docker compose up -d), restaurando o serviço estável no Edge sem a necessidade de intervenção física do engenheiro

    .

Parte 6: Monitoramento, Observabilidade e Logs Estruturados
Um dispositivo de IA em produção que não reporta seu comportamento interno é uma "caixa-preta" perigosa
. A observabilidade de Edge AI se divide em três esferas principais
:

    Camada de Sistema: Monitora a temperatura do Raspberry Pi (temperaturas acima de 80°C ativam o thermal throttling, que derruba drasticamente a frequência do processador e o processamento de FPS da IA)

, o uso de RAM (evitando vazamentos que ativem o Out of Memory Killer do Linux) e o ciclo de gravação no cartão microSD (para antecipar corrupções físicas)
.
Camada de API: Rastreia latência de inferência em milissegundos (inference_ms), taxa de requisições por minuto e erros de requisição
.
Camada de Modelo: Avalia desvios na distribuição dos dados de entrada (Data Drift, quando a iluminação ou os objetos em campo mudam muito em relação ao que o modelo foi treinado para ver)

    .

A Importância dos Logs Estruturados em JSON
Em produção, logs textuais convencionais gerados com print() comuns (ex: "[INFO] Inferência realizada em 120ms") são extremamente difíceis de ler por sistemas remotos ou scripts automatizados
.
Por isso, convertemos as saídas da API em Logs Estruturados JSON
:

{"timestamp": "2026-08-26T14:47:00Z", "level": "INFO", "event": "predict_complete", "model": "yolov8n.pt", "latency_ms": 143.7, "detections": 3, "image_id": "img_042"}

Desta forma, os dados passam a ser de fácil análise diretamente no terminal do Pi utilizando utilitários como o jq (que permite ordenar logs, filtrar erros por tipo ou calcular a latência média de inferência das últimas execuções de forma puramente programática)
.
