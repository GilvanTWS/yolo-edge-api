        b64 = base64.b64encode(img_path.read_bytes()).decode()
        return [b64, b64]

    def test_batch_returns_correct_count(self, two_images_b64):
        data = client.post("/predict/batch", json={
            "images_base64": two_images_b64,
            "confidence": 0.3,
