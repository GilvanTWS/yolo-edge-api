(Opcional / Recomendado): Para que o runner do GitHub Actions consiga entrar temporariamente na sua VPN para fazer o deploy, vá no painel do Tailscale (no navegador), vá em Settings ➔ Keys, clique em Generate auth key, marque as opções Reusable e Ephemeral, crie a chave e copie o token gerado (que começa com tskey-auth-...)
. No GitHub, salve esse token como um secret chamado TAILSCALE_AUTHKEY

    .

