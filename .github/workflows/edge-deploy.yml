2.4 Atualizar dependências e instalar ferramentas de teste
No Raspberry Pi, precisamos forçar uma versão compatível do Pillow e instalar o PyTorch CPU para rodar os testes localmente sem gargalos
:

# 1. Altere a linha Pillow no requirements.txt para v11.0.0
sed -i 's/Pillow==10.3.0/Pillow==11.0.0/g' app/requirements.txt

# 2. Instale PyTorch CPU de forma otimizada
pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu --break-system-packages

# 3. Instale o restante das dependências da API
pip install -r app/requirements.txt --break-system-packages

# 4. Instale o pytest e ruff para testes automatizados
pip install pytest ruff --break-system-packages

2.5 Configurar o Link Simbólico /app/models
Como sua API original busca o modelo no diretório absoluto /app/models (mapeado pelo Docker Compose), precisamos simular esse mapeamento de diretórios localmente no Raspberry Pi para os testes fora do container funcionarem
:

sudo mkdir -p /app
sudo ln -sfn ~/yolo-edge-api/models /app/models

# Confirme que o modelo é enxergado pelo link simbólico
ls -lh /app/models/yolov8n.pt

