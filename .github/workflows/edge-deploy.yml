Ah, esse é um comportamento clássico no Raspberry Pi (e sistemas Debian recentes)!
Apesar de o DVC ter sido instalado com sucesso (Successfully installed dvc-3.67.1), o instalador colocou o executável em uma pasta de usuário (~/.local/bin) que, por padrão, não está no "caminho de busca" (PATH) do seu terminal. Por isso, o Linux diz que o comando não foi encontrado.
Para resolver isso de forma definitiva e rápida, basta adicionar essa pasta ao seu PATH. Execute os seguintes comandos no terminal:
🛠️ Corrigindo o erro no terminal:

# 1. Adicione a pasta de executáveis do Python ao PATH do seu usuário
echo 'export PATH=$PATH:~/.local/bin' >> ~/.bashrc

# 2. Atualize o seu terminal para aplicar a mudança imediatamente
source ~/.bashrc

# 3. Teste se o sistema agora reconhece o DVC
dvc --version

Se o comando acima retornar a versão do DVC (como 3.67.1), o problema está resolvido!
