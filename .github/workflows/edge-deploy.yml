1. A Tríade de Artefatos no MLOps
Como vimos na introdução, um sistema de Edge AI não é feito apenas de código
. Para garantir a reprodutibilidade (saber exatamente o que está rodando em campo), precisamos gerenciar três elementos de forma independente, mas conectada
:

    Código-fonte e Configurações (com Git): Controla o arquivo da API (main.py), contratos (schemas.py), testes (test_api.py) e arquivos de infraestrutura (Dockerfile.api, docker-compose.yml)

.
Ambiente de Execução (com Docker e SemVer): Empacota o código e as dependências do sistema de forma imutável
.
Artefatos e Pesos do Modelo (com DVC): Gerencia os arquivos binários pesados (como o yolov8n.pt) sem sobrecarregar o Git

    .

2. Versionamento Semântico (SemVer) de Containers
Para as imagens Docker, adotamos o padrão MAJOR.MINOR.PATCH
:

    MAJOR (2.0.0): Mudanças que quebram compatibilidade (ex: migração de YOLOv8 para YOLOv9 ou alteração drástica no JSON de entrada/saída)

.
MINOR (1.1.0): Adição de funcionalidades sem quebrar o que já existe (ex: criar o endpoint /predict/batch)
.
PATCH (1.0.1): Correção de bugs internos (ex: corrigir o encode de Base64)

    .

⚠️ Regra de Ouro para o Edge: Nunca use a tag :latest em produção. Se um dispositivo perder conexão e reiniciar, ele pode subir uma imagem antiga que está em cache local, mascarando problemas ou gerando inconsistências difíceis de rastrear. Use sempre tags imutáveis baseadas em SemVer ou no hash do commit do Git (yolo-api:sha-a3f92c1)
.
3. Por que não colocar os pesos (.pt) direto no Git?
Arquivos binários grandes (como pesos de modelos, que variam de 6MB a centenas de MB) não devem entrar diretamente no Git
. O Git não foi projetado para lidar com binários; ele armazena a versão integral do arquivo a cada modificação (em vez de armazenar apenas as diferenças/deltas). Se você treinar e salvar seu modelo 10 vezes, seu repositório Git vai inchar de forma irreversível, tornando os comandos git clone e git pull extremamente lentos
.
O DVC (Data Version Control) resolve isso perfeitamente: ele armazena os binários pesados em um local externo (como um bucket S3, Google Cloud Storage ou uma pasta local simulada) e cria um pequeno arquivo de ponteiro de texto (extensão .pt.dvc) no Git
. Este arquivo de ponteiro contém apenas o hash MD5 exclusivo do binário. Assim, quando você faz um commit no Git, está salvando o ponteiro exato que aponta para o modelo correspondente daquele commit
!
4. Prática Passo a Passo no Raspberry Pi
Vamos configurar o DVC na sua estrutura de projeto. Certifique-se de estar conectado via SSH no seu Raspberry Pi
.
Passo 1: Preparando o .gitignore
Entre no diretório do seu projeto base e verifique se o arquivo .gitignore está protegendo o Git de arrastar arquivos .pt acidentalmente
:

cd ~/yolo-edge-api
nano .gitignore

Seu arquivo .gitignore deve conter o seguinte
:

# Pesos do modelo (gerenciados pelo DVC)
models/*.pt
models/*.onnx

# Python & Testes
__pycache__/
*.pyc
.pytest_cache/
.venv/

Salve e feche o arquivo (Ctrl+O, Enter, Ctrl+X).
Passo 2: Inicializar o DVC e salvar no Git
No terminal, execute:

# Instala o DVC no sistema operacional do Pi
pip install dvc --break-system-packages

# Inicializa o DVC no seu repositório
dvc init

# Adiciona as configurações do DVC criadas ao Git
git add .dvc .gitignore
git commit -m "chore: inicializa DVC no repositório"

Passo 3: Configurando o Storage Remoto Local
Como estamos simulando o ambiente, criaremos uma pasta fora do repositório Git para funcionar como nosso storage remoto (em produção, seria um S3 ou MinIO)
:

# Cria a pasta de storage simulado
mkdir -p ~/dvc-storage

# Configura como storage remoto do DVC chamado local_remote
dvc remote add -d local_remote ~/dvc-storage

Passo 4: Adicionando o modelo YOLOv8 ao DVC
Mova o arquivo físico do modelo para a pasta do repositório e passe o controle dele para o DVC
:

# Copia o peso do YOLOv8 para a pasta correta do novo repositório
cp ~/yolo-api/models/yolov8n.pt ~/yolo-edge-api/models/yolov8n.pt

# Adiciona o modelo ao rastreamento do DVC
dvc add models/yolov8n.pt

Note que o DVC moverá o arquivo real para o cache e gerará o arquivo de ponteiro models/yolov8n.pt.dvc
. Se você abrir esse arquivo com cat models/yolov8n.pt.dvc, verá o hash MD5 exclusivo do modelo
.
🚨 ALERTA DE ENTREGA 1 (10 pontos)
Objetivo: Captura do dvc push bem-sucedido
