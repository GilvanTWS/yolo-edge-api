A hora das duas primeiras entregas chegou! Vamos fazer isso agora mesmo para você garantir seus primeiros 25 pontos da atividade.
Como seu repositório yolo-edge-api já está com a estrutura de pastas correta e sincronizado com o GitHub, vamos configurar o DVC (Data Version Control) para rastrear o modelo pesado (yolov8n.pt).
Siga atentamente o passo a passo abaixo no terminal do seu Raspberry Pi:
Passo 1: Instalar e Inicializar o DVC
No terminal do seu Raspberry Pi, certifique-se de que está dentro da pasta do projeto (~/yolo-edge-api) e execute:

# 1. Instala o DVC no sistema (usando a flag para o Debian Bookworm do Raspberry Pi)
pip install dvc --break-system-packages

# 2. Inicializa o DVC dentro do seu repositório Git
dvc init

# 3. Adiciona as configurações automáticas do DVC ao Git
git add .dvc .gitignore
git commit -m "chore: inicializa o DVC no repositório"

Passo 2: Configurar o Armazenamento Remoto (Storage)
Para simular um servidor de armazenamento em nuvem (como AWS S3 ou Google Cloud Storage), vamos criar uma pasta dedicada fora do seu repositório Git para servir de "remoto":

# 1. Cria a pasta que servirá de armazenamento para os modelos reais
mkdir -p ~/dvc-storage

# 2. Configura essa pasta como o armazenamento padrão do DVC (chamado 'local_remote')
dvc remote add -d local_remote ~/dvc-storage

# 3. Adiciona a configuração do storage remoto ao Git
git add .dvc/config
git commit -m "chore: configura storage local do DVC"

Passo 3: Adicionar o Modelo YOLOv8 ao Rastreamento do DVC
Agora, vamos dizer ao DVC para cuidar do arquivo yolov8n.pt.

# Rastreia o modelo com o DVC
dvc add models/yolov8n.pt

O DVC vai criar um arquivo de ponteiro super leve chamado models/yolov8n.pt.dvc e atualizar seu .gitignore para que o Git nunca envie o arquivo .pt real para a nuvem.
