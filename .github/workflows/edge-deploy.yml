Etapa 2: Configurando Chaves SSH e Acesso Seguro
Para que o GitHub Actions na nuvem consiga acessar o seu Raspberry Pi físico de forma automatizada (sem você precisar digitar sua senha), precisamos usar chaves criptográficas SSH.
Siga os passos abaixo no terminal do seu Raspberry Pi:
1. Gerar o par de chaves SSH para o GitHub
Execute o comando abaixo para gerar uma chave moderna, rápida e altamente segura (do tipo ED25519) sem senha:

ssh-keygen -t ed25519 -f ~/.ssh/github_deploy_key -N ""

2. Autorizar essa chave a acessar seu Raspberry Pi
Precisamos dizer ao sistema operacional do Pi que quem apresentar essa chave gerada tem permissão de login. Para isso, adicione a chave pública ao arquivo de chaves autorizadas:

cat ~/.ssh/github_deploy_key.pub >> ~/.ssh/authorized_keys
chmod 600 ~/.ssh/authorized_keys

3. Visualizar e copiar a chave privada
Agora, você precisa exibir a chave privada na tela para copiá-la. É essa chave que daremos para o GitHub Actions usar como credencial de acesso. Execute:

cat ~/.ssh/github_deploy_key

📋 O que fazer agora: Selecione e copie todo o texto exibido no terminal, incluindo as linhas -----BEGIN OPENSSH PRIVATE KEY----- e -----END OPENSSH PRIVATE KEY-----.
Assim que você tiver copiado o conteúdo da chave, me avise! Vou te mostrar exatamente onde colar essa chave e quais outros segredos (Secrets) precisamos cadastrar no painel de configurações do seu repositório no GitHub para darmos vida ao pipeline.
🔑 Quer que eu te guie agora na configuração dos Secrets no painel do GitHub?

