Passo 2: Cadastrar os 4 Secrets de Conexão
Você vai criar os seguintes segredos, um por um, clicando em New repository secret para cada um
:

    RPI_USER
        Value: gilvantws (este é o nome do seu usuário no Raspberry Pi)
    RPI_DEPLOY_PATH
        Value: /home/gilvantws/yolo-edge-api (o caminho absoluto da sua pasta do projeto)
