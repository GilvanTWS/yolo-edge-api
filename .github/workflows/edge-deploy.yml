Excelente escolha! Vamos começar do início com a Parte 1: O Desafio do Edge AI e a Tríade do MLOps.
Esta parte é fundamental para você entender as dores do mundo real e por que não podemos tratar o deploy de Inteligência Artificial em hardware embarcado como se fosse um sistema web comum.
1. O Problema: "Funciona no Lab, Quebra no Campo"
Imagine que você desenvolveu um sistema de visão computacional de ponta: ele combina o modelo YOLOv8 containerizado, uma API de inferência escrita em FastAPI e orquestração de serviços via Docker Compose rodando perfeitamente no seu Raspberry Pi 5 de testes
.
No seu laboratório, com o Raspberry Pi na sua mesa, tudo funciona lindamente. Porém, o verdadeiro desafio começa quando o sistema vai para "campo" (produção)
. Surgem perguntas críticas de operação:

    Se o modelo yolov8n.pt for retreinado com novos dados, como enviá-lo para os dispositivos em campo sem interromper o serviço?

Se um bug for identificado no código, como garantir que a correção não quebre o sistema antes de chegar ao hardware?
Se você tiver 10 dispositivos espalhados, como saber exatamente qual versão está rodando em cada um?
Se uma atualização falhar no meio do deploy remoto, como recuperar a versão estável anterior rapidamente sem precisar ir até lá fisicamente?

2. DevOps Tradicional vs. MLOps
MLOps (Machine Learning Operations) é a extensão do DevOps tradicional (automação, rastreabilidade, entrega contínua) aplicada ao ciclo de vida de aprendizado de máquina, chegando até o hardware embarcado (Edge) onde a inferência ocorre
.
A grande diferença entre os dois está na presença do modelo como um artefato de primeira classe
. Em MLOps, gerenciamos uma Tríade de Artefatos:

    Código-fonte (app.py, main.py): Versionado de forma tradicional com Git

.
Imagem Docker (yolo-api:1.0.0): Versionada em um Container Registry
.
Pesos do Modelo (yolov8n.pt): Artefato binário, pesado, com métricas de qualidade associadas

    .

A diferença prática: se você atualizar apenas o arquivo de pesos do modelo (.pt) sem alterar uma única linha de código, o comportamento do sistema em produção muda completamente
. Por isso, o arquivo de pesos precisa ser tratado como um commit de código: rastreável, testável e reversível
.
3. As 3 Restrições Críticas do Edge
Fazer deploy na nuvem (AWS, Azure) é simples porque os servidores são potentes e homogêneos. No Edge, enfrentamos três barreiras severas:

    Arquitetura Heterogênea (ARM64): O Raspberry Pi 5 usa processador ARM64

. No entanto, os servidores (runners) padrão do GitHub Actions que constroem nossa aplicação rodam em arquitetura x86_64. Compilar ou testar nativamente para ARM64 na nuvem exige ferramentas de emulação (como o QEMU)
.
Conectividade Limitada: Dispositivos em campo geralmente usam redes 4G, Wi-Fi instável ou NB-IoT
. Ficar baixando imagens Docker pesadas de 500 MB a cada deploy é inviável. O pipeline precisa ser otimizado para transferir o mínimo possível
.
Hardware Irreversível: Se um deploy der errado em um servidor na nuvem, você cria outra instância
. No Edge, se um deploy corromper o sistema de arquivos do cartão SD, o dispositivo pode ficar completamente inacessível e "brickado". O pipeline precisa ser inteligente o suficiente para realizar um rollback automático local antes de declarar sucesso

    .

4. Cenário de Operação: Com MLOps vs. Sem MLOps
Cenário
	
Sem MLOps
	
Com MLOps
Atualizar o modelo
	
Acesso manual via SSH, substituição manual do arquivo .pt e reinício manual
.
	
Um push no repositório Git dispara build, testes e deploy 100% automático
.
Bug em produção
	
Queda total do sistema; rollback exige acesso físico ou conexões SSH de alto risco
.
	
O próprio pipeline ou o dispositivo detecta a falha e reverte para a versão estável anterior automaticamente
.
Rastreabilidade
	
Ninguém sabe exatamente qual modelo e código estão rodando em qual dispositivo
.
	
Registramos exatamente o Git tag + Docker tag + Hash do modelo em cada deploy
.
