git add .dvc .gitignore
git commit -m "chore: inicializa o DVC no repositório"

# 3. Crie a pasta remota e configure no DVC
mkdir -p ~/dvc-storage
dvc remote add -d local_remote ~/dvc-storage
git add .dvc/config
git commit -m "chore: configura storage local do DVC"

# 4. Adicione o seu modelo ao DVC
dvc add models/yolov8n.pt

