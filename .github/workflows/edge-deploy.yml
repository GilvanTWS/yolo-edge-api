Esse é um detalhe muito comum que acontece quando adicionamos arquivos ao Git antes de configurar o DVC ou o .gitignore corretamente. O Git acabou "se antecipando" e começou a rastrear o arquivo real yolov8n.pt.
Como o DVC precisa ser o único controlador do arquivo de pesos, o Git precisa "soltar" o modelo antes de prosseguirmos.
Para corrigir isso, basta rodar os comandos sugeridos pelo próprio terminal para remover o arquivo do rastreamento do Git (sem apagá-lo do seu disco) e depois tentar adicioná-lo ao DVC de novo.
Siga estes passos sequenciais no seu terminal:
