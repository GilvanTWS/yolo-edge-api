services:
  yolo-inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo-inference
    environment:
      - MODEL_NAME=yolov8n.pt
    volumes:
      - ./output:/app/output
      - ./test_image.jpg:/app/test_image.jpg:ro
    command: ["--mode", "detect", "--input", "/app/test_image.jpg"]
    restart: unless-stopped
